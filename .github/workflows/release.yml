name: Release

# Push a tag like v2.0.1 to build a universal app and publish it as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 scripts/build-app.sh

      - name: Zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="BC-MacScroll-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/BC MacScroll.app" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes: the matching section of CHANGELOG.md plus install notes.
          awk -v v="$VERSION" '$0 ~ "^## "v {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install:** unzip, drag **BC MacScroll.app** to Applications, then open it. This build is not notarized, so the first time
          go to System Settings → Privacy & Security and click **Open Anyway**. Requires macOS 13+. Universal (Apple Silicon + Intel).
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "BC MacScroll $VERSION" --notes-file notes.md
