name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build universal app
        run: UNIVERSAL=1 scripts/build-app.sh

      - name: Check bundle
        run: |
          APP="build/BC MacScroll.app"
          codesign --verify --strict "$APP"
          lipo -info "$APP/Contents/MacOS/BCMacScroll"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundle(Identifier|ShortVersionString)'
